<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StudyNest</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#00A86B">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- G01 ログイン -->
  <main id="scr-login" class="form-screen" hidden>
    <h1>StudyNest</h1>
    <p class="sub">地域みんなの自習室。</p>
    <section class="card">
      <h2>ログイン</h2>
      <input id="li-id" placeholder="ログインID" autocomplete="username">
      <input id="li-pw" type="password" placeholder="パスワード" autocomplete="current-password">
      <button id="li-btn" class="btn">ログイン</button>
      <a href="#" id="to-signup">はじめての人は新規登録</a>
    </section>
  </main>

  <!-- G14 新規登録 -->
  <main id="scr-signup" class="form-screen" hidden>
    <h1>StudyNest</h1>
    <section class="card">
      <h2>新規登録</h2>
      <input id="su-id" placeholder="ログインID（ほかの人には見えません）" autocomplete="username">
      <input id="su-pw" type="password" placeholder="パスワード（8文字以上）" autocomplete="new-password">
      <input id="su-user" placeholder="ユーザー名 @（半角4〜15文字）">
      <input id="su-nick" placeholder="なまえ（8文字まで・本名はNG）" maxlength="8">
      <select id="su-area"></select>
      <label><input type="checkbox" id="su-parent"> 保護者の同意をもらいました</label>
      <label><input type="checkbox" id="su-terms"> 利用規約とプライバシーポリシーに同意します</label>
      <button id="su-btn" class="btn">登録する</button>
      <a href="#" id="to-login">ログインにもどる</a>
    </section>
  </main>

  <!-- 部屋一覧 -->
  <main id="scr-lobby" class="form-screen" hidden>
    <header class="top">
      <div><b id="me-name"></b>さん</div>
      <div class="today">今日 <b id="today-min">0</b>分 ・ チケット <b id="today-tk">0</b>枚</div>
    </header>
    <h2>部屋をえらぶ</h2>
    <ul id="room-list" class="room-list"></ul>
    <button id="logout" class="btn ghost">ログアウト</button>
  </main>

  <!-- 自習室 -->
  <main id="scr-room" class="room-screen" hidden>
    <canvas id="room-canvas"></canvas>
    <div class="room-top">
      <button id="back-lobby" class="chip">‹ 部屋一覧</button>
      <b id="room-title"></b>
      <span id="room-count" class="chip"></span>
    </div>
    <div class="room-bottom">
      <div id="hint">光っているイスをタップして座ろう</div>
      <div id="timer-box" hidden>
        <div class="timer" id="timer">0:00:00</div>
        <div class="tsub" id="timer-sub">次のチケットまで 30分</div>
        <button id="stand-btn" class="btn">立ち上がる（勉強おわり）</button>
      </div>
    </div>
  </main>

  <!-- G16 勉強おわりの結果 -->
  <div id="result" class="dialog" hidden>
    <div class="dialog-card">
      <h2>おつかれさま！</h2>
      <p class="big"><b id="res-min">0</b>分 勉強しました</p>
      <p id="res-tk"></p>
      <button id="res-ok" class="btn">とじる</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/room.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
